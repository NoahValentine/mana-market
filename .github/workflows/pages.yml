name: Deploy to Pages

# Publishes the site whenever the code changes. Prices come from the nightly
# workflow; this one just rebuilds the pack from whatever history is committed
# and redeploys.

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'history/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # With no history committed yet (a fresh repo), keep the demo pack that
      # ships in public/data so the site still renders.
      - name: Rebuild the pack from committed history
        run: |
          if ls history/*.csv >/dev/null 2>&1; then
            npm run pack
          else
            echo "No history/*.csv yet -- deploying the committed demo pack."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4
