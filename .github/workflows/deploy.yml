name: Prices and deploy

# One workflow does everything, so the deployed site always carries a freshly
# built pack:
#   * nightly on a schedule
#   * whenever code is pushed
#   * on demand from the Actions tab
#
# Steps: pull today's prices from Scryfall's bulk file, rebuild the data pack,
# run the tests, commit the day's history CSV, publish to GitHub Pages, and
# push phone alerts.

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/**'
      - 'test/**'
      - 'alerts.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: write   # commit history/<day>.csv
  pages: write      # publish to GitHub Pages
  id-token: write   # required by the Pages deploy action

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # Skipped when today's snapshot is already committed, so several pushes in
      # one day do not re-download Scryfall's bulk file (about 500 MB).
      - name: Ingest today's Scryfall snapshot
        run: |
          today=$(date -u +%Y-%m-%d)
          if [ -f "history/$today.csv" ]; then
            echo "history/$today.csv already exists, skipping the download."
          else
            npm run ingest
          fi

      - name: Build the data pack
        run: npm run pack

      - name: Prune history older than 400 days
        run: |
          cutoff=$(date -u -d '400 days ago' +%Y-%m-%d)
          for f in history/*.csv; do
            [ -e "$f" ] || continue
            day=$(basename "$f" .csv)
            if [[ "$day" < "$cutoff" ]]; then git rm -q "$f"; fi
          done

      # Only the daily CSVs are committed (~150 KB/day). The pack itself is
      # rebuilt every run and uploaded straight to Pages: committing it would
      # add megabytes a day for no benefit.
      - name: Commit history
        run: |
          git config user.name 'mana-market-bot'
          git config user.email 'mana-market-bot@users.noreply.github.com'
          git add history/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: prices $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # Phone alerts via ntfy.sh. No topic configured yet just means no alerts,
      # which must never fail the price update.
      - name: Send alerts
        continue-on-error: true
        env:
          SITE_URL: ${{ steps.deploy.outputs.page_url }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: npm run alerts
